name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14.2"
          enable-cache: true

      - name: Test OCEA client without Home Assistant
        run: >-
          uv run --locked --package ocea-client --python 3.14.2
          python -m unittest discover -s ocea_tests -v

      - name: Build OCEA client distribution
        run: >-
          uv build --package ocea-client
          --out-dir "${{ runner.temp }}/ocea-dist"

      - name: Run Home Assistant and quality scale tests
        run: >-
          uv run --python 3.14.2
          --with homeassistant==2026.7.3
          --with pytest-homeassistant-custom-component
          --with pytest-cov==7.1.0
          python -m pytest -q
          --cov=custom_components.ocea_smart_building.ocea
          --cov-report=term-missing
          --cov-report=json:${{ runner.temp }}/ocea-coverage.json

      - name: Check OCEA per-module coverage
        run: >-
          python3 scripts/check_ocea_coverage.py
          "${{ runner.temp }}/ocea-coverage.json"

      - name: Run Ruff
        run: >-
          uvx --from "ruff==0.16.1"
          ruff check custom_components tests ocea_tests

      - name: Type-check OCEA client and coordinator
        run: >-
          uv run --python 3.14.2
          --with homeassistant==2026.7.3
          --with mypy==1.18.2
          python -m mypy

      - name: Check Python compilation
        run: >-
          uv run --python 3.14.2
          python -m compileall -q custom_components tests ocea_tests ocea_cli.py

      - name: Validate JSON files
        run: |
          python3 -m json.tool custom_components/ocea_smart_building/manifest.json >/dev/null
          python3 -m json.tool custom_components/ocea_smart_building/strings.json >/dev/null
          python3 -m json.tool custom_components/ocea_smart_building/translations/en.json >/dev/null
          python3 -m json.tool custom_components/ocea_smart_building/translations/fr.json >/dev/null

      - name: Check patch formatting
        run: git diff --check HEAD^ HEAD
